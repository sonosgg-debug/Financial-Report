name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (9:00 AM KST)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://klkfwpyafqjuvlamgssj.supabase.co
